plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.matchbot'
    compileSdk 37

    defaultConfig {
        applicationId "com.example.matchbot"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
